name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # pytest directly rather than `make test`, which calls .venv/bin/pytest
      # and so assumes a local virtualenv that CI does not build.
      #
      # No Companies House API key and no network: tests/conftest.py and the
      # client tests work against recorded fixtures, and the parsed filings in
      # data/parsed/ are committed. The `make ingest` stage, which does call
      # the API, is not run here.
      - name: Run tests
        run: pytest -q tests
